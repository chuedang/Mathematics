<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pet House Sanctuary</title>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { touch-action: pan-y; -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
    body { font-family: 'Mitr', sans-serif; background: #2c3e50; margin: 0; padding: 0; overflow-x: hidden; width: 100vw; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    /* Login Section */
    #loginPage { background: white; padding: 40px 30px; border-radius: 30px; width: 90%; max-width: 340px; margin-top: 60px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
    .login-input { width: 100%; padding: 15px; margin: 10px 0; border-radius: 15px; border: 1px solid #ddd; font-family: 'Mitr'; font-size: 16px; outline: none; }
    #loginBtn { background: #2ecc71; color: white; border: none; padding: 15px; border-radius: 15px; width: 100%; font-family: 'Mitr'; font-size: 16px; cursor: pointer; box-shadow: 0 4px 0 #27ae60; font-weight: 500; }
    #loginBtn:disabled { background: #bdc3c7 !important; color: #7f8c8d !important; box-shadow: 0 4px 0 #95a5a6 !important; cursor: not-allowed; }

    /* Dashboard Main Container */
    #dashboard { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 400px; padding: 15px 0 30px 0; gap: 15px; }

    /* Top Bar Header */
    .top-bar {
      width: 90%; background: rgba(255, 255, 255, 0.95); border-radius: 20px; padding: 12px 15px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15); border: 2px solid #f39c12;
    }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: 600; font-size: 15px; color: #2c3e50; }
    .user-class { font-size: 11px; color: #7f8c8d; }
    .top-right-group { display: flex; gap: 8px; align-items: center; }
    .stats-group { display: flex; flex-direction: column; gap: 3px; }
    .stat-badge { background: #fef9e7; border: 1px solid #f1c40f; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; color: #d35400; display: flex; align-items: center; gap: 4px; }
    
    /* ปุ่มภารกิจขวาบน */
    .btn-mission-toggle {
      background: #3498db; color: white; border: none; padding: 8px 12px;
      border-radius: 12px; font-family: 'Mitr'; font-size: 13px; font-weight: 500;
      cursor: pointer; box-shadow: 0 3px 0 #2980b9; display: flex; align-items: center; gap: 4px;
    }
    .btn-mission-toggle:active { transform: translateY(2px); box-shadow: 0 1px 0 #2980b9; }

    /* Pet House Scene */
    .pet-house-card {
      width: 90%; height: 360px; border-radius: 25px; position: relative; overflow: hidden;
      box-shadow: 0 12px 25px rgba(0,0,0,0.25); border: 4px solid #fff;
      background: linear-gradient(to bottom, #74b9ff 0%, #74b9ff 50%, #55efc4 50%, #00b894 100%);
    }
    
    .house-wall { position: absolute; top: 0; width: 100%; height: 50%; background: #ffeaa7; opacity: 0.3; }
    .house-fence { position: absolute; top: 40%; width: 100%; height: 25px; background: repeating-linear-gradient(90deg, #d63031, #d63031 15px, transparent 15px, transparent 25px); opacity: 0.4; }

    /* Pet Container & Animation */
    @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -54%) scale(1.02); } }
    .avatar-container { 
      width: 170px; height: 170px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; justify-content: center; align-items: center; 
      animation: breathe 3s ease-in-out infinite; z-index: 5;
    }
    #avatar-base { width: auto; height: 90%; image-rendering: pixelated; }

    /* Props: ชามข้าว ชามน้ำ */
    .pet-props { position: absolute; bottom: 25px; width: 100%; display: flex; justify-content: space-around; padding: 0 30px; z-index: 3; }
    .bowl { width: 55px; height: 30px; border-radius: 0 0 15px 15px; position: relative; border: 2px solid #636e72; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .food-bowl { background: #e17055; }
    .food-bowl::before { content: '🍖'; position: absolute; top: -14px; left: 14px; font-size: 20px; }
    .water-bowl { background: #0984e3; }
    .water-bowl::before { content: '💧'; position: absolute; top: -14px; left: 14px; font-size: 20px; }

    /* Modal หน้าต่างภารกิจ */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); z-index: 100; justify-content: center; align-items: center;
    }
    .mission-card {
      background: white; border-radius: 25px; padding: 20px; width: 90%; max-width: 360px;
      max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative;
    }
    .mission-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    .mission-title { margin: 0; font-size: 18px; color: #2c3e50; }
    .close-btn { background: #e74c3c; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .mission-item { padding: 12px; border-radius: 15px; margin-bottom: 10px; border-left: 8px solid #ccc; font-size: 14px; }
    .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 10px; float: right; color: white; }
    .done-bg { background: #27ae60; }
    .wait-bg { background: #95a5a6; }

    .btn-logout { width: 90%; background: #fab1a0; color: #d63031; border: none; padding: 12px; border-radius: 15px; font-family: 'Mitr'; cursor: pointer; font-weight: 500; font-size: 15px; }
  </style>
</head>
<body>

  <!-- 1. Login Section -->
  <div id="loginPage">
    <h2 style="color: #634d3a; margin-top: 0;">🏡 Pet Sanctuary</h2>
    <input type="text" id="username" class="login-input" placeholder="รหัสนักเรียน (ID)">
    <input type="password" id="password" class="login-input" placeholder="รหัสผ่าน">
    <button id="loginBtn" onclick="login()" disabled>กำลังโหลดบ้านสัตว์เลี้ยง...</button>
  </div>

  <!-- 2. Main Game Dashboard -->
  <div id="dashboard">
    
    <!-- Top Bar Header (ชื่อ, เลเวล, เงิน, ปุ่มเปิดภารกิจ) -->
    <div class="top-bar">
      <div class="user-info">
        <span class="user-name" id="displayName">-</span>
        <span class="user-class">🏫 ชั้นเรียน: <span id="displaySheet">-</span></span>
      </div>
      <div class="top-right-group">
        <div class="stats-group">
          <div class="stat-badge">⭐ Lv.<span id="displayLevel">0</span></div>
          <div class="stat-badge">💰 <span id="displayScore">0</span></div>
        </div>
        <!-- ปุ่มกดดูภารกิจขวาบน -->
        <button class="btn-mission-toggle" onclick="openMissionModal()">📜 ภารกิจ</button>
      </div>
    </div>

    <!-- Pet House Scene -->
    <div class="pet-house-card">
      <div class="house-wall"></div>
      <div class="house-fence"></div>
      
      <!-- Pet Avatar -->
      <div class="avatar-container">
        <img id="avatar-base" src="https://img1.pic.in.th/images/Gemini_Generated_Image_v4dyj4v4dyj4v4dy-removebg-preview.md.png">
      </div>

      <!-- Food & Water Bowls -->
      <div class="pet-props">
        <div class="bowl food-bowl" title="ชามอาหาร"></div>
        <div class="bowl water-bowl" title="ชามน้ำ"></div>
      </div>
    </div>

    <button class="btn-logout" onclick="location.reload()">🚪 ออกจากเกม (Logout)</button>
  </div>

  <!-- Modal หน้าต่างภารกิจ/เช็กงาน -->
  <div class="modal-overlay" id="missionModal">
    <div class="mission-card">
      <div class="mission-header">
        <h3 class="mission-title">📜 รายการภารกิจ</h3>
        <button class="close-btn" onclick="closeMissionModal()">✕</button>
      </div>
      <div id="mission-list"></div>
    </div>
  </div>

<script>
  // ===================================================
  // 1. ตั้งค่า API URL และตัวแปรหลัก
  // ===================================================
  const API_URL = "https://script.google.com/macros/s/AKfycbxg0xhtPcOjhhc-0udhctTCIxJeSuWAwpAuQVqA6MMwy7k2ZYb7XSawanf9XshEwzkeWA/exec";
  
  let allStudentsData = [];
  let currentStudent = null;

  // ===================================================
  // 2. โหลดข้อมูลเมื่อเปิดเว็บ
  // ===================================================
  window.onload = function() {
    const loginBtn = document.getElementById("loginBtn");
    if(loginBtn) {
      loginBtn.disabled = true;
      loginBtn.textContent = "🔮 กำลังดาวน์โหลดข้อมูลบ้านสัตว์เลี้ยง...";
    }

    fetch(`${API_URL}?t=${new Date().getTime()}`)
      .then(response => {
        if (!response.ok) throw new Error("เชื่อมต่อล้มเหลว");
        return response.json();
      })
      .then(data => {
        allStudentsData = data;
        if(loginBtn) {
          loginBtn.disabled = false;
          loginBtn.textContent = "เข้าบ้านสัตว์เลี้ยง";
        }
      })
      .catch(error => {
        console.error("Load Error:", error);
        if(loginBtn) {
          loginBtn.textContent = "⚠️ ไม่สามารถเชื่อมต่อฐานข้อมูลได้";
        }
      });
  };

  // ===================================================
  // 3. ระบบ Login
  // ===================================================
  function login() {
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();

    if (!u || !p) return alert("กรุณากรอกรหัสนักเรียนและรหัสผ่าน!");
    if (!allStudentsData || allStudentsData.length === 0) return alert("ระบบกำลังโหลดข้อมูล กรุณารอสักครู่!");

    const student = allStudentsData.find(s => String(s["รหัสเข้า"] || "").trim() === u);
    if (!student) return alert("ไม่พบรหัสนักเรียนนี้!");

    const dbPassword = String(student["รหัสผ่าน"] || "").trim();
    if (dbPassword !== p) return alert("รหัสผ่านไม่ถูกต้อง!");

    currentStudent = {
      "รหัสนักเรียน": student["รหัสเข้า"],
      "ชื่อ": student["ชื่อ"] || "-",
      "คะแนน": parseFloat(student["คะแนน"]) || 0,
      "เลเวล": parseInt(student["เลเวล"]) || 0,
      "ชั้น": student["ชั้น"] || "-",
      "ภารกิจ": student["ภารกิจ"] || []
    };

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("dashboard").style.display = "flex";

    // อัปเดตข้อมูล UI บน Header Top Bar
    document.getElementById("displayName").textContent = currentStudent["ชื่อ"];
    document.getElementById("displayLevel").textContent = currentStudent.เลเวล;
    document.getElementById("displayScore").textContent = currentStudent["คะแนน"];
    
    const classText = document.getElementById("displaySheet");
    if (classText) classText.textContent = currentStudent["ชั้น"];

    renderMissions();
  }

  // ===================================================
  // 4. ระบบจัดการหน้าต่าง Modal ภารกิจ
  // ===================================================
  function openMissionModal() {
    document.getElementById("missionModal").style.display = "flex";
  }

  function closeMissionModal() {
    document.getElementById("missionModal").style.display = "none";
  }

  function renderMissions() {
    const missions = currentStudent.ภารกิจ || currentStudent.missions || [];
    let passedMidterm = false;
    
    if (missions.length === 0) {
      document.getElementById("mission-list").innerHTML = "<p style='text-align:center; color:#7f8c8d;'>ไม่มีรายการภารกิจ</p>";
      return;
    }

    const html = missions.map((m) => {
      const scoreNum = parseFloat(m.score || m.คะแนน) || 0;
      const isDone = scoreNum > 0;
      const missionName = m.name || m.ชื่อภารกิจ || m.ชื่อ || "ภารกิจไม่มีชื่อ";
      
      let cls = "background:#fff4e6; border-left-color:#f39c12;";
      if (passedMidterm) cls = "background:#f3e5f5; border-left-color:#8e44ad;";
      if (missionName.includes("สอบกลางภาค")) passedMidterm = true;
      
      const scoreText = isDone ? `<br><span style="color:#27ae60; font-weight:500;">✨ ได้รับ +${scoreNum} คะแนน</span>` : "";
      return `<div class="mission-item" style="${cls}"><span class="status-badge ${isDone?'done-bg':'wait-bg'}">${isDone?'⚔️ สำเร็จ':'⏳ รอ'}</span><b>${missionName}</b>${scoreText}</div>`;
    }).join('');
    
    document.getElementById("mission-list").innerHTML = html;
  }
</script>
</body>
</html>
